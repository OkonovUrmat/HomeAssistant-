name: HomeAssistant

options:
  bundleIdPrefix: com.okonov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  HomeAssistantKit:
    path: Packages/HomeAssistantKit

targets:
  HomeAssistant:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: HomeAssistantKit
        product: Core
      - package: HomeAssistantKit
        product: DesignSystem
      - package: HomeAssistantKit
        product: Networking
      - package: HomeAssistantKit
        product: Persistence
      - package: HomeAssistantKit
        product: MediaManagement
      - package: HomeAssistantKit
        product: DocumentProcessing
      - package: HomeAssistantKit
        product: Dashboard
      - package: HomeAssistantKit
        product: KnowledgeBase
      - package: HomeAssistantKit
        product: Instructions
      - package: HomeAssistantKit
        product: AIChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okonov.homeassistant
        PRODUCT_NAME: Home Assistant
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Home Assistant
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos of equipment, valves and panels to document your house."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Add photos of your house systems to your knowledge base."
        CODE_SIGN_STYLE: Automatic

schemes:
  HomeAssistant:
    build:
      targets:
        HomeAssistant: all
    run:
      config: Debug
      commandLineArguments:
        "-sampleData": true
    test:
      config: Debug
    archive:
      config: Release
